[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-agent-mcp-server"
version = "0.1.0"
description = "SQL Agent MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hmsclient==0.1.1",
    "httpx==0.28.1",
    "mcp==1.27.0",
    "PyHive==0.7.0",
    "pure-sasl==0.6.2",
    "PyMySQL==1.1.2",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "SQLAlchemy==2.0.49",
    "thrift==0.22.0",
    "thrift-sasl==0.4.3",
    "uvicorn==0.50.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]
langchain = [
    "langchain==1.2.15",
    "langchain-mcp-adapters==0.2.2",
]

[project.scripts]
sql-agent-mcp-server = "sql_agent_mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
