services:
  neo4j:
    container_name: sql-agent-neo4j
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${DATA_MAP_NEO4J_AUTH:-neo4j/sql-agent-map}
      NEO4J_server_memory_heap_initial__size: ${DATA_MAP_NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${DATA_MAP_NEO4J_HEAP_MAX:-1g}
      NEO4J_server_memory_pagecache_size: ${DATA_MAP_NEO4J_PAGECACHE:-512m}
    ports:
      - "127.0.0.1:${DATA_MAP_NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${DATA_MAP_NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - data-map-neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  agent:
    container_name: sql-agent-agent
    build:
      context: .
      dockerfile: agent/Dockerfile
    image: sql-agent-agent:latest
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-agent/.env}
    environment:
      APP_PORT: ${AGENT_PORT:-8284}
      AGENT_CWD: /app
      CLAUDE_CODE_DEBUG_FILE: /app/logs/claude-debug.log
    command:
      - --port
      - "${AGENT_PORT:-8284}"
      - --workers
      - "1"
    ports:
      - "127.0.0.1:${AGENT_PORT:-8284}:${AGENT_PORT:-8284}"
    volumes:
      - "${HOST_LOG_DIR:-./logs}:/app/logs"
      - "${HOST_CLAUDE_DIR:-./.claude}:/root/.claude"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(f\"http://127.0.0.1:{os.environ['APP_PORT']}/health\", timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  data-map-neo4j:
